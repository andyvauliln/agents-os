/* Header rendered from state, then the state view: history bar over the editor. */
:root{--bg:#f3f5f8;--panel:#ffffff;--gutter:#f7f8fa;--fg:#17202c;--muted:#6a7584;--line:#dde2e9;--accent:#3152d4;--on-accent:#ffffff;--sel:#dbe3fb;
  --key:#17202c;--key-empty:#8b95a5;--str:#18794e;--num:#b4530b;--atom:#7b3fc4;--warn:#a35a00;--bad:#c0322b;
  --add:#18794e;--add-bg:#e3f4ea;--upd:#a35a00;--upd-bg:#fbefd6;--del:#c0322b;--del-bg:#fbe4e2;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;--sans:system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141b;--panel:#161d27;--gutter:#131922;--fg:#e4e9f0;--muted:#8c98aa;--line:#263040;--accent:#8aa4ff;--on-accent:#0f141b;--sel:#27355c;
  --key:#e4e9f0;--key-empty:#77839a;--str:#6fd3a0;--num:#f0a35e;--atom:#c39bff;--warn:#f0b35e;--bad:#ff8a80;
  --add:#6fd3a0;--add-bg:#163325;--upd:#f0c05e;--upd-bg:#3a2e12;--del:#ff8a80;--del-bg:#3d1a1a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f141b;--panel:#161d27;--gutter:#131922;--fg:#e4e9f0;--muted:#8c98aa;--line:#263040;--accent:#8aa4ff;--on-accent:#0f141b;--sel:#27355c;
  --key:#e4e9f0;--key-empty:#77839a;--str:#6fd3a0;--num:#f0a35e;--atom:#c39bff;--warn:#f0b35e;--bad:#ff8a80;
  --add:#6fd3a0;--add-bg:#163325;--upd:#f0c05e;--upd-bg:#3a2e12;--del:#ff8a80;--del-bg:#3d1a1a;color-scheme:dark}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button{font:inherit}
button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;background:var(--panel);border-bottom:1px solid var(--line);display:flex;justify-content:flex-end;align-items:center;padding-block:8px;min-height:40px}
.btn{padding:7px 12px;border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap}
.btn[aria-pressed="true"]{background:var(--sel);border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.icon{width:34px;padding:7px 0;text-align:center}
.btn:disabled{opacity:.45;cursor:default}
#state-view{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding-block:12px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.pos{font:12px var(--mono);color:var(--muted);min-width:0}
.pos b{color:var(--fg);font-weight:500}
.status{font-size:12px;color:var(--muted);margin-left:auto}
.status.dirty{color:var(--warn)}.status.bad{color:var(--bad)}
.legend{display:flex;gap:10px;font:11px var(--mono);color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
#editor{flex:1;min-height:240px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.CodeMirror{height:100%;font:13px/1.6 var(--mono);background:var(--panel);color:var(--fg)}
.CodeMirror-gutters{background:var(--gutter);border-right:1px solid var(--line)}
.CodeMirror-linenumber{color:var(--muted)}
.CodeMirror-cursor{border-left-color:var(--fg)}
.CodeMirror-selected,.CodeMirror-focused .CodeMirror-selected{background:var(--sel)}
.CodeMirror-line::selection,.CodeMirror-line>span::selection,.CodeMirror-line>span>span::selection{background:var(--sel)}
.CodeMirror-scrollbar-filler,.CodeMirror-gutter-filler{background:var(--panel)}
.CodeMirror-foldgutter{width:14px}
.CodeMirror-foldgutter-open,.CodeMirror-foldgutter-folded{cursor:pointer;color:var(--muted);text-align:center}
.CodeMirror-foldgutter-open:after{content:"\25BE"}
.CodeMirror-foldgutter-folded:after{content:"\25B8";color:var(--accent)}
.CodeMirror-foldmarker{color:var(--accent);background:var(--sel);border-radius:4px;padding:0 5px;margin:0 2px;cursor:pointer;font-family:var(--mono)}
div.CodeMirror span.CodeMirror-matchingbracket{color:var(--accent);font-weight:600}
div.CodeMirror span.CodeMirror-nonmatchingbracket{color:var(--bad)}
.cm-s-agent .cm-string{color:var(--str)}
.cm-s-agent .cm-string.cm-key{color:var(--key);font-weight:500}
.cm-s-agent .cm-string.cm-key.cm-emptykey{color:var(--key-empty);font-weight:400}
.cm-s-agent .cm-number{color:var(--num)}
.cm-s-agent .cm-atom{color:var(--atom)}
.cm-s-agent .cm-emptyobj{color:var(--key-empty)}
.bad-line{background:var(--del-bg)}
.chg-added{background:var(--add-bg);box-shadow:inset 3px 0 var(--add)}
.chg-updated{background:var(--upd-bg);box-shadow:inset 3px 0 var(--upd)}
.chg-deleted{background:var(--del-bg);box-shadow:inset 3px 0 var(--del)}
.chg-deleted .CodeMirror-line{text-decoration:line-through;text-decoration-color:var(--del)}
.was{font:11px var(--mono);color:var(--upd);margin-left:10px;opacity:.9}
.CodeMirror-readonly .CodeMirror-cursor{display:none}

<header class="wrap" id="header"></header>
<main id="state-view" class="wrap" hidden>
  <div class="bar">
    <button id="older" class="btn icon" type="button" aria-label="Older version" title="Older version (&larr;)">&larr;</button>
    <button id="newer" class="btn icon" type="button" aria-label="Newer version" title="Newer version (&rarr;)">&rarr;</button>
    <span id="pos" class="pos" aria-live="polite"></span>
    <button id="changes" class="btn" type="button" aria-pressed="false">Changes</button>
    <button id="collapse" class="btn" type="button">Collapse all</button>
    <span id="legend" class="legend" hidden><span><i style="background:var(--add)"></i>added</span><span><i style="background:var(--upd)"></i>updated</span><span><i style="background:var(--del)"></i>deleted</span></span>
    <span id="status" class="status" role="status"></span>
    <button id="save" class="btn primary" type="button">Save</button>
  </div>
  <div id="editor"></div>
</main>

<script>
(function(){
'use strict';
var core=window.StateCore;
var $=function(id){return document.getElementById(id)};
var session='s'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
var S={commits:[],draft:null,pos:0,open:false,changes:false,store:'memory',canWrite:true,busy:false,err:null,ready:false};
var store=memoryStore(),db=null,cm=null,badLine=null,marks=[],widgets=[];

/* ---------- storage: commits/c000001..., and one calls/<session> log per page load ---------- */
function memoryStore(){var list=[];return{kind:'memory',list:function(){return Promise.resolve(list.slice())},put:function(c){list.push(c);return Promise.resolve()}}}
function dbStore(db){return{kind:'db',
  list:function(){return db.collection('commits').orderBy('n').get().then(function(s){return s.docs.map(function(d){return d.data()})})},
  put:function(c){return db.collection('commits').doc(core.commitId(c.n)).set(c)}}}
var callsTimer=null,callsWriting=false,callsAgain=false;
function queueCalls(){clearTimeout(callsTimer);callsTimer=setTimeout(writeCalls,1200)}
function writeCalls(){
  if(!db)return;if(callsWriting){callsAgain=true;return}
  callsWriting=true;
  var items=tracker.records.slice(-500).map(function(r){return JSON.parse(JSON.stringify(r))});
  db.doc('calls/'+session).set({session:session,started:items.length?items[0].at:null,count:tracker.records.length,items:items})
    .catch(function(){}).then(function(){callsWriting=false;if(callsAgain){callsAgain=false;writeCalls()}});
}
var tracker=core.createTracker({onRecord:queueCalls});
var track=tracker.track;

/* ---------- derived state ---------- */
function head(){return S.commits[S.commits.length-1]}
function headState(){return head()?JSON.parse(head().state):{}}
function last(){return core.historyLength(S.commits,S.draft)-1}
function atDraft(){return S.draft!==null&&S.pos===S.commits.length}
function editable(){return !S.changes&&(atDraft()||(S.draft===null&&S.pos===S.commits.length-1))}
function currentText(){return core.textAt(S.pos,S.commits,S.draft)}
function hv(state){try{return state.extension.view['header-view']||{}}catch(e){return {}}}

/* ---------- actions: every call is tracked ---------- */
var actions={
  load:function(){return track('loadState',{session:session},function(ctx){
    return fetch('state.json').then(function(r){if(!r.ok)throw new Error('state.json: HTTP '+r.status);return r.text()}).then(function(seed){
      JSON.parse(seed);
      var getDb=window.claude&&claude.use?claude.use('db'):Promise.resolve(null);
      return getDb.then(function(d){db=d;if(d)store=dbStore(d);S.store=store.kind;return store.list()}).then(function(list){
        S.commits=list;
        if(list.length)return null;
        var c1=core.makeCommit(null,seed.replace(/\s+$/,''),new Date().toISOString());
        return store.put(c1).then(function(){S.commits=[c1];ctx.relate({created:1})},function(e){S.canWrite=false;S.commits=[c1];ctx.relate({created:0,writeError:e&&e.code||String(e)})});
      }).then(function(){
        S.pos=S.commits.length-1;
        S.open=!!(hv(headState()).state_button||{}).pressed;
        S.ready=true;
        ctx.relate({store:S.store,commits:S.commits.length,head:head().n});
        render();
        return {commits:S.commits.length,head:head().n,open:S.open};
      });
    });
  })},
  toggleStateView:function(){return track('toggleStateView',{open:!S.open},function(ctx){
    S.open=!S.open;ctx.relate({head:head()&&head().n,pos:S.pos});render();return {open:S.open};
  })},
  step:function(delta){return track('stepHistory',{delta:delta},function(ctx){
    var from=S.pos;S.pos=core.step(S.pos,delta,S.commits,S.draft);
    ctx.relate({from:label(from),to:label(S.pos)});render();return {pos:S.pos,version:label(S.pos)};
  })},
  toggleChanges:function(){return track('toggleChanges',{on:!S.changes},function(ctx){
    S.changes=!S.changes;render();
    var v=S.changes?core.changesView.apply(null,pairArgs()):null;
    if(v)ctx.relate({version:label(S.pos),summary:countMarks(v.marks),paths:v.marks.slice(0,50).map(function(m){return m.type+' '+m.path.join('.')})});
    return {on:S.changes};
  })},
  collapseAll:function(){return track('collapseAll',null,function(ctx){
    var n=0;cm.operation(function(){for(var l=cm.lastLine();l>0;l--){var r=CodeMirror.fold.brace(cm,CodeMirror.Pos(l,0));if(r){cm.foldCode(CodeMirror.Pos(l,0),{rangeFinder:CodeMirror.fold.brace,widget:'\u2026'},'fold');n++}}});
    ctx.relate({version:label(S.pos),folded:n});return {folded:n};
  })},
  edit:function(text){return track('editDraft',{length:text.length},function(ctx){
    var h=head().state;
    S.draft=text===h?null:text;S.pos=S.draft===null?S.commits.length-1:S.commits.length;
    try{var c=core.summarize(core.diff(JSON.parse(h),JSON.parse(text)));ctx.relate({against:head().n,summary:c})}catch(e){ctx.relate({against:head().n,invalid:e.message})}

  })},
  save:function(){return track('saveCommit',null,function(ctx){
    if(S.draft===null)throw new Error('Nothing to save');
    JSON.parse(S.draft);
    var c=core.makeCommit(head(),S.draft,new Date().toISOString());
    S.busy=true;renderBar();
    return store.put(c).then(function(){
      S.commits.push(c);S.draft=null;S.pos=S.commits.length-1;S.busy=false;
      ctx.relate({commit:c.n,parent:c.parent,summary:c.summary,paths:c.paths.slice(0,50),store:S.store});
      render();return {commit:c.n};
    },function(e){S.busy=false;if(e&&e.code==='invalid_argument')S.canWrite=false;renderBar();throw e});
  })}
};
function label(pos){return pos<S.commits.length?'v'+S.commits[pos].n:'draft'}
function pairArgs(){var p=core.pairAt(S.pos,S.commits,S.draft);return [p.before,p.after]}
function countMarks(m){var s={added:0,updated:0,deleted:0};m.forEach(function(x){s[x.type]++});return s}

/* ---------- rendering ---------- */
function render(){renderHeader();$('state-view').hidden=!S.open;if(S.open){renderEditor();renderBar();cm.refresh()}}
function renderHeader(){
  var h=$('header');h.textContent='';
  var sb=hv(headState()).state_button;if(!sb)return;
  var b=document.createElement('button');b.type='button';b.className='btn';b.id='state-button';b.textContent='State view';
  b.setAttribute('aria-pressed',String(S.open));b.onclick=function(){actions.toggleStateView()};h.appendChild(b);
}
function renderBar(){
  var n=S.commits.length,p=S.pos;
  $('older').disabled=p<=0;$('newer').disabled=p>=last();
  var pos=$('pos');pos.textContent='';
  var b=document.createElement('b');b.textContent=atDraft()?'Unsaved draft':'Version '+S.commits[p].n+' of '+n;pos.appendChild(b);
  if(!atDraft())pos.appendChild(document.createTextNode(' \u00b7 '+fmt(S.commits[p].at)));
  $('changes').setAttribute('aria-pressed',String(S.changes));$('legend').hidden=!S.changes;
  $('collapse').disabled=false;
  var st=$('status'),dirty=S.draft!==null;
  $('save').disabled=!dirty||!!S.err||S.busy||!S.canWrite;
  st.className='status'+(S.err?' bad':dirty?' dirty':'');
  st.textContent=S.err&&!S.changes&&(atDraft()||editable())?'Invalid JSON: '+S.err
    :S.busy?'Saving\u2026':!S.canWrite?'View only'
    :S.changes?(lastView&&lastView.empty?'No changes in this version':'')
    :!editable()?'Older version \u00b7 read only'
    :dirty?'Unsaved changes':(S.store==='memory'?'Saved in this tab only':'Saved');
}
var lastView=null,settingValue=false;
function renderEditor(){
  marks.forEach(function(m){cm.removeLineClass(m.line,'background',m.cls)});marks=[];
  widgets.forEach(function(w){w.clear()});widgets=[];
  var text,view=null;
  if(S.changes){view=core.changesView.apply(null,pairArgs());text=view.text}else text=currentText();
  lastView=view;
  if(cm.getValue()!==text){settingValue=true;cm.setValue(text);cm.clearHistory();settingValue=false}
  cm.setOption('readOnly',editable()?false:'nocursor');
  cm.getWrapperElement().classList.toggle('CodeMirror-readonly',!editable());
  if(view)view.marks.forEach(function(m){
    for(var l=m.from;l<=m.to;l++){var h=cm.addLineClass(l,'background','chg-'+m.type);marks.push({line:h,cls:'chg-'+m.type})}
    if(m.type==='updated'){var w=document.createElement('span');w.className='was';w.textContent='was '+JSON.stringify(m.before);widgets.push(cm.setBookmark(CodeMirror.Pos(m.to,cm.getLine(m.to).length),{widget:w}))}
  });
  check();
}
function check(){
  S.err=null;
  if(badLine!==null){cm.removeLineClass(badLine,'background','bad-line');badLine=null}
  if(!S.changes){try{JSON.parse(cm.getValue())}catch(e){
    S.err=e.message;var m=/line (\d+)/.exec(e.message),p=/position (\d+)/.exec(e.message);
    var ln=m?+m[1]-1:p?cm.posFromIndex(+p[1]).line:null;if(ln!==null){badLine=ln;cm.addLineClass(ln,'background','bad-line')}
  }}
}
function fmt(iso){try{return new Date(iso).toLocaleString(undefined,{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}catch(e){return iso}}

/* ---------- editor ---------- */
var keyOverlay={token:function(s){
  if(s.match(/^"(?:[^"\\]|\\.)*"(?=\s*:\s*\{\s*\})/))return 'key emptykey';
  if(s.match(/^"(?:[^"\\]|\\.)*"(?=\s*:)/))return 'key';
  if(s.match(/^\{\s*\}/))return 'emptyobj';
  while(s.next()!=null&&!s.match(/^(?=["{])/,false)){}
  return null;
}};
cm=CodeMirror($('editor'),{value:'',mode:{name:'javascript',json:true},theme:'agent',lineNumbers:true,indentUnit:2,tabSize:2,
  foldGutter:true,gutters:['CodeMirror-linenumbers','CodeMirror-foldgutter'],matchBrackets:true,autoCloseBrackets:true,
  extraKeys:{'Cmd-S':function(){saveClick()},'Ctrl-S':function(){saveClick()}}});
cm.addOverlay(keyOverlay);
var editTimer=null;
cm.on('change',function(){
  if(settingValue)return;
  check();
  if(S.draft===null){S.pos=S.commits.length}
  S.draft=cm.getValue();renderBar();
  clearTimeout(editTimer);editTimer=setTimeout(function(){actions.edit(cm.getValue())},700);
});
function saveClick(){if(!S.err&&S.draft!==null&&!S.busy){clearTimeout(editTimer);actions.edit(cm.getValue());actions.save().catch(function(e){var st=$('status');st.className='status bad';st.textContent='Could not save: '+((e&&e.message)||e)})}}

$('older').onclick=function(){actions.step(-1)};
$('newer').onclick=function(){actions.step(1)};
$('changes').onclick=function(){actions.toggleChanges()};
$('collapse').onclick=function(){actions.collapseAll()};
$('save').onclick=saveClick;
document.addEventListener('keydown',function(e){
  if(!S.open||e.altKey||e.metaKey||e.ctrlKey||(e.key!=='ArrowLeft'&&e.key!=='ArrowRight'))return;
  if(cm.hasFocus()&&editable())return;
  if(/^(INPUT|TEXTAREA)$/.test(e.target.tagName))return;
  e.preventDefault();actions.step(e.key==='ArrowLeft'?-1:1);
});

window.agentOS={actions:actions,calls:tracker.records,state:S,core:core,editor:cm};
actions.load().catch(function(e){var h=$('header');h.textContent='Could not load state: '+((e&&e.message)||e)});
})();
</script>
