html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
#index-view{height:100%;display:flex;flex-direction:column}
button{font:inherit}
button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

#header-view{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;background:var(--panel);border-bottom:1px solid var(--line);padding-block:8px;min-height:36px;display:flex;justify-content:flex-end;align-items:center}
#state-view{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding-block:12px}
.sv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}

.lg-add{background:var(--add)}.lg-upd{background:var(--upd)}.lg-del{background:var(--del)}
.btn{padding:7px 12px;border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap}
.btn[aria-pressed="true"]{background:var(--sel);border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.icon{width:34px;padding:7px 0;text-align:center}
.btn:disabled{opacity:.45;cursor:default}
.pos{font:12px var(--mono);color:var(--muted);min-width:0}
.pos b{color:var(--fg);font-weight:500}
.status{font-size:12px;color:var(--muted);margin-left:auto}
.status.dirty{color:var(--warn)}.status.bad{color:var(--bad)}
.legend{display:flex;gap:10px;font:11px var(--mono);color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.boot-error{margin:24px auto;max-width:640px;padding:16px;border:1px solid var(--bad);border-radius:10px;background:var(--panel);display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.boot-error pre{margin:0;white-space:pre-wrap;font:12px var(--mono);color:var(--bad)}
.CodeMirror{height:100%;font:13px/1.6 var(--mono);background:var(--panel);color:var(--fg)}
.CodeMirror-gutters{background:var(--gutter);border-right:1px solid var(--line)}
.CodeMirror-linenumber{color:var(--muted)}
.CodeMirror-cursor{border-left-color:var(--fg)}
.CodeMirror-selected,.CodeMirror-focused .CodeMirror-selected{background:var(--sel)}
.CodeMirror-line::selection,.CodeMirror-line>span::selection,.CodeMirror-line>span>span::selection{background:var(--sel)}
.CodeMirror-scrollbar-filler,.CodeMirror-gutter-filler{background:var(--panel)}
.CodeMirror-foldgutter{width:14px}
.CodeMirror-foldgutter-open,.CodeMirror-foldgutter-folded{cursor:pointer;color:var(--muted);text-align:center}
.CodeMirror-foldgutter-open:after{content:"\25BE"}
.CodeMirror-foldgutter-folded:after{content:"\25B8";color:var(--accent)}
.CodeMirror-foldmarker{color:var(--accent);background:var(--sel);border-radius:4px;padding:0 5px;margin:0 2px;cursor:pointer;font-family:var(--mono)}
div.CodeMirror span.CodeMirror-matchingbracket{color:var(--accent);font-weight:600}
div.CodeMirror span.CodeMirror-nonmatchingbracket{color:var(--bad)}
.cm-s-agent .cm-string{color:var(--str)}
.cm-s-agent .cm-string.cm-key{color:var(--key);font-weight:500}
.cm-s-agent .cm-string.cm-key.cm-emptykey{color:var(--key-empty);font-weight:400}
.cm-s-agent .cm-number{color:var(--num)}
.cm-s-agent .cm-atom{color:var(--atom)}
.cm-s-agent .cm-emptyobj{color:var(--key-empty)}
.cm-s-agent .cm-comment{color:var(--muted);font-style:italic}
.bad-line{background:var(--del-bg)}
.chg-added{background:var(--add-bg);box-shadow:inset 3px 0 var(--add)}
.chg-updated{background:var(--upd-bg);box-shadow:inset 3px 0 var(--upd)}
.chg-deleted{background:var(--del-bg);box-shadow:inset 3px 0 var(--del)}
.chg-deleted .CodeMirror-line{text-decoration:line-through;text-decoration-color:var(--del)}
.was{font:11px var(--mono);color:var(--upd);margin-left:10px;opacity:.9}

<script>
(function(){
'use strict';
var core=window.StateCore;
var session='s'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
var live=null,db=null,store=null,mounted={},importsDone={};
var H={commits:[],draft:null,pos:0,changes:false,canWrite:true,busy:false,err:null,storeKind:'memory'};

/* ---------- storage: commits/c000001...; one calls/<session> log per page load ---------- */
function memoryStore(){var list=[];return{kind:'memory',list:function(){return Promise.resolve(list.slice())},put:function(c){list.push(c);return Promise.resolve()}}}
function dbStore(db){return{kind:'db',
  list:function(){return db.collection('commits').orderBy('n').get().then(function(s){return s.docs.map(function(d){return d.data()})})},
  put:function(c){return db.collection('commits').doc(core.commitId(c.n)).set(c)}}}
var callsTimer=null,callsWriting=false,callsAgain=false;
function queueCalls(){clearTimeout(callsTimer);callsTimer=setTimeout(writeCalls,1200)}
function writeCalls(){
  if(!db)return;if(callsWriting){callsAgain=true;return}
  callsWriting=true;
  var items=tracker.records.slice(-400).map(function(r){return JSON.parse(JSON.stringify(r))});
  db.doc('calls/'+session).set({session:session,started:items.length?items[0].at:null,count:tracker.records.length,items:items})
    .catch(function(){}).then(function(){callsWriting=false;if(callsAgain){callsAgain=false;writeCalls()}});
}
var tracker=core.createTracker({onRecord:queueCalls,brief:core.brief});

/* ---------- running functions from state ---------- */
// "extension.functions.render" is a path in the state; "local.x" is a function of the calling view.
function resolve(name,viewPath){

}
function loadImports(imports){
  var urls=[];Object.keys(imports||{}).forEach(function(k){urls=urls.concat(imports[k])});
  return urls.reduce(function(p,u){return p.then(function(){
    if(importsDone[u])return importsDone[u];
    return importsDone[u]=new Promise(function(res,rej){var s=document.createElement('script');s.src=u;s.onload=res;s.onerror=function(){rej(new Error('Could not load '+u))};document.head.appendChild(s)});
  })},Promise.resolve());

function call(name,input,viewPath,parent){
  var r=resolve(name,viewPath);
  return tracker.track(name,{input:input===undefined?null:input,view:viewPath||null},function(ctx){
    if(!r)throw new Error('No function '+name+(viewPath?' in '+viewPath:''));
    var def=r.def,before=core.clone(core.stripRuntime(live)),t0=performance.now();

      call:function(n,i){return call(n,i,r.view,ctx.id)},get:OS.get,set:OS.set};
    return loadImports(def.imports).then(function(){
      if(def.code&&def.code.trim()){
        var f=new Function('ctx','input','os','"use strict";return (async function(){\n'+def.code+'\n})();');
        return f(c,input,OS);
      }

      var names=Object.keys(def.calls||{});
      return names.reduce(function(p,n){return p.then(function(){return call(n,def.calls[n].input,r.view,ctx.id).then(function(o){def.calls[n].output=core.brief(o)})})},Promise.resolve())
        .then(function(){return {calls:names}});
    }).then(function(out){
      var ms=Math.round((performance.now()-t0)*10)/10,p=def.performance||{};
      def.performance={last:ms,min:p.min===undefined?ms:Math.min(p.min,ms),max:p.max===undefined?ms:Math.max(p.max,ms),count:(p.count||0)+1};
      def.output=core.brief(out);
      if(def.calls)Object.keys(def.calls).forEach(function(n){var last=tracker.records.slice().reverse().find(function(x){return x.name===n&&x.related.parent===ctx.id});if(last)def.calls[n].output=last.output});
      var changes=core.diff(before,core.stripRuntime(live)).map(function(x){return x.type+' '+x.path.join('.')});
      ctx.relate({stateChanges:changes,performance:def.performance});
      return out;
    });
  });
}

/* ---------- the os object every function gets ---------- */
var OS={
  get:function(path){return core.getPath(live,path)},
  set:function(path,value){core.setPath(live,path,value)},
  clone:core.clone,
  call:function(name,input,viewPath,parent){return call(name,input,viewPath,parent)},
  template:core.template,
  mounted:function(path){return !!mounted[path]},
  setMounted:function(path,on){mounted[path]=on;if(!on&&path==='extension.views.state-view')editor.unmount()},
  bind:function(root,viewPath){
    Array.prototype.forEach.call(root.querySelectorAll('[data-call]'),function(b){
      b.addEventListener('click',function(){var i=b.getAttribute('data-input');call(b.getAttribute('data-call'),i===null?{}:JSON.parse(i),viewPath).catch(report)});
    });
  },
  runTests:function(){return runTests()},
  editor:null
};

/* ---------- state view editor: history, changes, save ---------- */
var editor=OS.editor=(function(){
  var cm=null,root=null,badLine=null,marks=[],widgets=[],lastView=null,settingValue=false,editTimer=null;
  function $(id){return root.querySelector('#'+id)}
  function head(){return H.commits[H.commits.length-1]}
  function last(){return core.historyLength(H.commits,H.draft)-1}
  function atDraft(){return H.draft!==null&&H.pos===H.commits.length}
  function atHead(){return H.draft===null&&H.pos===H.commits.length-1}
  function editable(){return !H.changes&&(atDraft()||atHead())}
  function textAt(pos){return core.textAt(pos,H.commits,H.draft)}
  function atHeadPos(pos){return pos===H.commits.length-1}
  function pair(){var p=core.pairAt(H.pos,H.commits,H.draft);return [core.stripRuntime(p.before),core.stripRuntime(p.after)]}

      });

      if(settingValue)return;
      check();
      H.draft=cm.getValue();H.pos=H.commits.length;bar();
      clearTimeout(editTimer);editTimer=setTimeout(settleDraft,500);
    });

    bar();
  }
  function render(){
    if(!cm)return;
    marks.forEach(function(m){cm.removeLineClass(m.line,'background',m.cls)});marks=[];
    widgets.forEach(function(w){w.clear()});widgets=[];

    if(H.changes){view=core.changesView.apply(null,pair());text=view.text}

    lastView=view;
    if(cm.getValue()!==text){settingValue=true;cm.setValue(text);cm.clearHistory();settingValue=false}
    cm.setOption('readOnly',editable()?false:'nocursor');

      for(var l=m.from;l<=m.to;l++){var h=cm.addLineClass(l,'background','chg-'+m.type);marks.push({line:h,cls:'chg-'+m.type})}

    });

    H.err=null;H.fixable=false;
    if(badLine!==null){cm.removeLineClass(badLine,'background','bad-line');badLine=null}
    if(!H.changes){try{core.parseJsonc(cm.getValue())}catch(e){
      H.err=e.message;try{core.parseJsonc(core.autofix(cm.getValue()));H.fixable=true}catch(_){}var m=/line (\d+)/.exec(e.message),p=/position (\d+)/.exec(e.message);
      var ln=m?+m[1]-1:p?cm.posFromIndex(+p[1]).line:null;if(ln!==null){badLine=ln;cm.addLineClass(ln,'background','bad-line')}

  }
  function bar(){
    if(!root)return;
    var n=H.commits.length,p=H.pos;
    $('older').disabled=p<=0;$('newer').disabled=p>=last();
    var pos=$('pos');pos.textContent='';
    var b=document.createElement('b');b.textContent=atDraft()?'Unsaved draft':'Version '+H.commits[p].n+' of '+n;pos.appendChild(b);
    if(!atDraft())pos.appendChild(document.createTextNode(' · '+fmt(H.commits[p].at)));
    $('changes').setAttribute('aria-pressed',String(H.changes));$('legend').hidden=!H.changes;
    var st=$('status'),dirty=H.draft!==null;
    $('save').disabled=!dirty||(!!H.err&&!H.fixable)||H.busy||!H.canWrite;
    st.className='status'+(H.err&&!H.fixable?' bad':dirty?' dirty':'');
    st.textContent=H.err&&editable()?(H.fixable?'JSON has slips; Save fixes them':'Invalid JSON: '+H.err)
      :H.busy?'Saving…':!H.canWrite?'View only'
      :H.changes?(lastView&&lastView.empty?'No changes in this version':'')
      :!editable()?'Older version · read only'
      :dirty?'Unsaved changes':(H.storeKind==='memory'?'Saved in this tab only':'Saved');
  }
  function fmt(iso){try{return new Date(iso).toLocaleString(undefined,{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}catch(e){return iso}}
  return {
    mount:mount,unmount:unmount,
    step:function(delta){var from=H.pos;H.pos=core.step(H.pos,+delta||0,H.commits,H.draft);render();return {from:label(from),to:label(H.pos)}},
    toggleChanges:function(){
      H.changes=!H.changes;render();
      if(!H.changes)return {on:false};
      var v=lastView,s={added:0,updated:0,deleted:0};v.marks.forEach(function(m){s[m.type]++});
      return {on:true,version:label(H.pos),summary:s,paths:v.marks.slice(0,50).map(function(m){return m.type+' '+m.path.join('.')})};
    },
    collapseAll:function(){
      var n=0;cm.operation(function(){for(var l=cm.lastLine();l>0;l--){if(CodeMirror.fold.brace(cm,CodeMirror.Pos(l,0))){cm.foldCode(CodeMirror.Pos(l,0),{rangeFinder:CodeMirror.fold.brace,widget:'…'},'fold');n++}}});
      return {version:label(H.pos),folded:n};
    },
    save:function(){
      clearTimeout(editTimer);settleDraft();
      if(H.draft===null)throw new Error('Nothing to save');
      // Broken JSON is repaired first; the repaired text goes into the editor and is what gets saved.
      var text=H.draft,fixed=false,next;
      try{next=core.parseJsonc(text)}catch(e){text=core.autofix(text);next=core.parseJsonc(text);fixed=true;
        settingValue=true;var cur=cm.getCursor();cm.setValue(text);cm.setCursor(cur);settingValue=false;H.draft=text;check()}
      var c=core.makeCommit(head(),text,new Date().toISOString());
      H.busy=true;bar();
      return store.put(c).then(function(){
        H.commits.push(c);H.draft=null;H.pos=H.commits.length-1;H.busy=false;
        live=next;
        render();
        return {commit:c.n,parent:c.parent,summary:c.summary,paths:c.paths.slice(0,50),store:H.storeKind,fixed:fixed};
      },function(e){H.busy=false;if(e&&e.code==='invalid_argument')H.canWrite=false;bar();throw e});
    },
    keys:function(e){
      if(!cm||e.altKey||e.metaKey||e.ctrlKey||(e.key!=='ArrowLeft'&&e.key!=='ArrowRight'))return;
      if(cm.hasFocus()&&editable())return;
      if(/^(INPUT|TEXTAREA)$/.test(e.target.tagName))return;
      e.preventDefault();call('local.step',e.key==='ArrowLeft'?-1:1,'extension.views.state-view').catch(report);
    }
  };
})();
document.addEventListener('keydown',function(e){editor.keys(e)});
// Cmd+S / Ctrl+S saves from anywhere on the page, on any keyboard layout (e.code is the physical key).
document.addEventListener('keydown',function(e){
  if(!(e.metaKey||e.ctrlKey)||e.code!=='KeyS')return;
  e.preventDefault();
  if(mounted['extension.views.state-view']&&H.draft!==null)call('local.save',{},'extension.views.state-view').catch(report);
},true);

/* ---------- tests written in the state ---------- */
function runTests(){
  var list=[];
  core.walk(live,[],function(v,p){
    if(p[p.length-2]!=='functions'||!v||!v.tests||p.indexOf('calls')>=0||p.indexOf('output')>=0)return;
    var name=p[p.length-1],viewPath=name.indexOf('local.')===0?p.slice(0,-2).join('.'):null,fnName=viewPath?name:p.join('.');
    Object.keys(v.tests).forEach(function(t){list.push({fn:fnName,view:viewPath,test:t,spec:v.tests[t]})});
  });
  var results=[];
  return list.reduce(function(prev,item){return prev.then(function(){
    return tracker.track('runTest',{fn:item.fn,test:item.test},function(ctx){
      var t0=performance.now(),before=item.spec.before||{};
      // "before" lists calls that put the page in the state the test needs.
      return Object.keys(before).reduce(function(p,n){return p.then(function(){return call(n,before[n],item.view,ctx.id)})},Promise.resolve()).then(function(){
        return call(item.fn,item.spec.input,item.view,ctx.id);
      }).then(function(out){
        return core.checkExpect(item.spec.expect||{},out,function(sel){return !!document.querySelector(sel)});
      },function(e){return ['threw: '+(e&&e.message||e)]}).then(function(fails){
        var res={ok:!fails.length,fails:fails,ms:Math.round((performance.now()-t0)*10)/10,at:new Date().toISOString()};
        item.spec.result=res;ctx.relate({fn:item.fn,test:item.test,ok:res.ok});
        results.push({fn:item.fn,test:item.test,ok:res.ok,fails:fails});
        return res;
      });
    });
  })},Promise.resolve()).then(function(){return results});
}

/* ---------- boot ---------- */
function report(e){console.error(e)}
function bootError(e,canRetry){
  var app=document.getElementById('index-view');app.textContent='';
  var box=document.createElement('div');box.className='boot-error';
  var h=document.createElement('strong');h.textContent='This version of the state did not start';box.appendChild(h);
  var pre=document.createElement('pre');pre.textContent=String(e&&e.stack||e&&e.message||e);box.appendChild(pre);
  if(canRetry){var b=document.createElement('button');b.className='btn';b.textContent='Run version '+H.commits[H.commits.length-2].n+' instead';
    b.onclick=function(){live=core.parseJsonc(H.commits[H.commits.length-2].state);start()};box.appendChild(b)}
  app.appendChild(box);
}
function start(){
  mounted={};
  return call('extension.functions.render','extension.views.index-view',null).catch(function(e){bootError(e,H.commits.length>1);throw e});
}
var loaded=tracker.track('loadState',{session:session},function(ctx){
  return fetch('state.json').then(function(r){if(!r.ok)throw new Error('state.json: HTTP '+r.status);return r.text()}).then(function(seed){
    var getDb=window.claude&&claude.use?claude.use('db'):Promise.resolve(null);
    return getDb.then(function(d){db=d;store=d?dbStore(d):memoryStore();H.storeKind=store.kind;return store.list()}).then(function(list){
      H.commits=list;
      if(list.length)return;
      var c1=core.makeCommit(null,seed.replace(/\s+$/,''),new Date().toISOString());
      return store.put(c1).then(function(){H.commits=[c1];ctx.relate({created:1})},function(e){H.canWrite=false;H.commits=[c1];ctx.relate({created:0,writeError:e&&e.code||String(e)})});
    }).then(function(){
      var head=H.commits[H.commits.length-1];
      live=core.parseJsonc(head.state);H.pos=H.commits.length-1;
      ctx.relate({store:H.storeKind,commits:H.commits.length,head:head.n});
      return {commits:H.commits.length,head:head.n};
    });
  });
});
window.agentOS={os:OS,calls:tracker.records,history:H,get state(){return live},ready:loaded.then(start)};
window.agentOS.ready.catch(function(e){if(!document.querySelector('.boot-error'))bootError(e,false)});
})();
</script>
