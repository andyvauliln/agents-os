      var cfg=JSON.stringify({id:viewPath,view:state,state:frame,src:SRC}).replace(/</g,'\\u003c');
      return '<!doctype html><meta charset="utf-8"><style>html,body{margin:0}</style><div id="index-view"></div>'+
        '<script src="state-core.js"><\/script><script>window.agentOSPreview='+cfg+'<\/script><script>'+SRC+'<\/script>';
    }
    frame.setAttribute('data-preview',id);
    frame.onload=function(){
      var w=frame.contentWindow;
      if(!w||frame.getAttribute('data-preview')!==id)return;
      coreSource().then(function(src){
        if(frame.getAttribute('data-preview')!==id)return;
        w.agentOSPreview={id:id,view:viewPath,state:state,src:SRC};
        w.eval(src);
        w.eval(SRC);
      }).catch(report);
    };
    frame.srcdoc='<!doctype html><meta charset="utf-8"><style>html,body{margin:0}</style><div id="index-view"></div>';
  },
  history:history,
  // What a view keeps while it is on screen that cannot live in the state (an editor instance, unsaved text).
  refs:{}
};

/* ---------- tests written in the state ---------- */
function runTests(){
  var list=[];
  core.walk(live,[],function(v,p){
    if(p[p.length-2]!=='functions'||!v||!v.tests||p.indexOf('calls')>=0||p.indexOf('output')>=0)return;
    var name=p[p.length-1],viewPath=name.indexOf('local.')===0?p.slice(0,-2).join('.'):null,fnName=viewPath?name:p.join('.');
    Object.keys(v.tests).forEach(function(t){list.push({fn:fnName,view:viewPath,test:t,path:p.join('.')})});
  });
  var results=[];
  return list.reduce(function(prev,item){return prev.then(function(){
    var spec=core.getPath(live,item.path).tests[item.test];
    return tracker.track('runTest',{fn:item.fn,test:item.test},function(ctx){
      var t0=performance.now(),before=spec.before||{},start=null;
      // "before" lists calls that put the page in the state the test needs.
      return Object.keys(before).reduce(function(p,n){return p.then(function(){return call(n,before[n],item.view,ctx.id)}).then(function(){return afterTop(n,ctx.id)})},Promise.resolve()).then(function(){
        start=core.stripRuntime(live);
        return call(item.fn,spec.input,item.view,ctx.id);
      }).then(function(out){
        return afterTop(item.fn,ctx.id).then(function(){
          // The state after the run: expected-state-change errors, then the test's own expect (output, dom, state).
          var errs=core.getPath(live,item.path).errors||[];
          var st={get:function(p){return core.getPath(live,p)},changed:core.diff(start,core.stripRuntime(live)).map(function(x){return x.path.join('.')})};
          return errs.concat(core.checkExpect(spec.expect||{},out,function(sel){return !!document.querySelector(sel)},st));
        });
      },function(e){return ['threw: '+(e&&e.message||e)]}).then(function(fails){
        var res={ok:!fails.length,fails:fails,ms:Math.round((performance.now()-t0)*10)/10,at:new Date().toISOString()};
        var s=core.getPath(live,item.path);if(s&&s.tests&&s.tests[item.test])s.tests[item.test].result=res;
        ctx.relate({fn:item.fn,test:item.test,ok:res.ok});
        results.push({fn:item.fn,test:item.test,ok:res.ok,fails:fails});
        return res;
      });
    });
  })},Promise.resolve()).then(function(){return afterTop('runTests')}).then(function(){return results});
}

/* ---------- boot ---------- */
function report(e){console.error(e);if(SB)tell(null,String(e&&e.message||e))}
function bootError(e,canRetry){
  var app=document.getElementById('index-view');app.textContent='';
  var box=document.createElement('div');box.className='boot-error';
  var h=document.createElement('strong');h.textContent='This version of the state did not start';box.appendChild(h);
  var pre=document.createElement('pre');pre.textContent=String(e&&e.stack||e&&e.message||e);box.appendChild(pre);
  var c=history.commits;
  if(canRetry){var b=document.createElement('button');b.textContent='Run version '+c[c.length-2].n+' instead';
    b.onclick=function(){live=core.parseJsonc(c[c.length-2].state);start()};box.appendChild(b)}
  app.appendChild(box);
}
function start(){
  mounted={};watchers={};
  if(SB)return startPreview();
  // Older versions take the view path itself as input; newer ones take { view_path }.
  var r=core.getPath(live,'extension.functions.render'),sig=r&&/^\s*(import\b|(async\s+)?function\b)/.test(r.code||'');
  return call('extension.functions.render',sig?{view_path:'extension.views.index-view'}:'extension.views.index-view',null,null,'start').catch(function(e){bootError(e,history.commits.length>1);throw e});
}
// A preview: index-view's html is put on the page without running it, then the one view renders.
function startPreview(){
  seen=core.stripRuntime(live);
  if(SB.view!=='extension.views.index-view'){
    var iv=core.getPath(live,'extension.views.index-view')||{},t=document.createElement('template'),host=document.getElementById('index-view');
    t.innerHTML=core.template(iv.html||'',iv['ui-data']||{});
    var el=t.content.firstElementChild;
    if(el&&el.id==='index-view')host.replaceWith(el);else host.innerHTML=t.innerHTML;
  }
  return call('extension.functions.render',{view_path:SB.view},null).catch(function(e){report(e);throw e});
}
var ready=SB?Promise.resolve().then(function(){
  live=core.clone(SB.state);history.canWrite=false;history.kind='preview';
  try{history.commits=parent.agentOS.history.commits.slice()}catch(e){history.commits=[]}
  store={kind:'preview',list:function(){return Promise.resolve(history.commits)},put:function(){return Promise.reject(new Error('A preview does not save'))}};
  return {preview:SB.view};
}):tracker.track('loadState',{session:session},function(ctx){
  return fetch('state.json').then(function(r){if(!r.ok)throw new Error('state.json: HTTP '+r.status);return r.text()}).then(function(seed){
    var getDb=window.claude&&claude.use?apiCall('connect to the database',"window.claude.use('db')",claude.use('db')):Promise.resolve(null);
    return getDb.then(function(d){db=d;store=d?dbStore(d):memoryStore();history.kind=store.kind;return store.list()}).then(function(list){
      history.commits=list;
      if(list.length)return;
      var c1=core.makeCommit(null,seed.replace(/\s+$/,''),new Date().toISOString());
      return store.put(c1).then(function(){history.commits.push(c1);ctx.relate({created:1})},function(e){history.canWrite=false;history.commits.push(c1);ctx.relate({created:0,writeError:e&&e.code||String(e)})});
    }).then(function(){
      var head=history.commits[history.commits.length-1];
      live=core.parseJsonc(head.state);
      // What this load downloaded (state.json, the database calls) goes into network: these are the changes of this block.
      var loaded=core.stripRuntime(live);sense();
      var ch=core.diff(loaded,core.stripRuntime(live));
      ctx.relate({store:history.kind,commits:history.commits.length,head:head.n,changes:ch.map(function(x){return x.type+' '+x.path.join('.')}),
        stateChanges:ch.map(function(x){return {type:x.type,path:x.path.join('.'),before:core.brief(x.before),after:core.brief(x.after)}})});
      return {commits:history.commits.length,head:head.n};
    });
  });
});
// A newer version saved somewhere else (another tab, or a release) runs here as soon as it is saved,
// unless this page has unsaved edits. A page that stays open never shows an old version.
// The page stays as it was: each view keeps its ui-data values, for the keys the new version still has.
function keepUiData(old,next){
  var ov=core.getPath(old,'extension.views')||{},nv=core.getPath(next,'extension.views')||{};
  Object.keys(nv).forEach(function(k){
    var a=ov[k]&&ov[k]['ui-data'],b=nv[k]&&nv[k]['ui-data'];
    if(!a||!b||typeof a!=='object'||typeof b!=='object')return;
    Object.keys(b).forEach(function(f){if(Object.prototype.hasOwnProperty.call(a,f))b[f]=core.clone(a[f])});
  });
}
function follow(){
  if(!db)return;
  var q=db.collection('commits').orderBy('n');
  if(!q.onSnapshot)return;
  q.onSnapshot(function(s){
    var a=api['follow new versions']||(api['follow new versions']={what:"db.collection('commits').orderBy('n').onSnapshot(...)",count:0});
    if(a.start===undefined)a.start=Math.round(performance.now());
    a.count++;a.last=Math.round(performance.now());
    var known=history.commits.length?history.commits[history.commits.length-1].n:0;
    var fresh=s.docs.map(function(d){return d.data()}).filter(function(c){return c&&c.n>known&&!own[c.n]});
    if(!fresh.length)return;
    Promise.all(fresh.map(unpackCommit)).then(function(fresh){
      // (a later snapshot got here first)
      if(history.commits.length&&history.commits[history.commits.length-1].n!==known)return;
      fresh.sort(function(a,b){return a.n-b.n}).forEach(addCommit);
      var sv=OS.refs['state-view'];
      if(sv&&sv.draft!==null)return;
      return tracker.track('loadNewerVersion',{head:history.commits[history.commits.length-1].n,from:known},function(){
        var next=core.parseJsonc(history.commits[history.commits.length-1].state);
        keepUiData(live,next);
        live=next;
        return start();
      }).then(function(){return afterTop('loadNewerVersion')});
    }).catch(report);
  },function(e){report(e)});
}
window.agentOS={os:OS,calls:tracker.records,history:history,get state(){return live},ready:ready.then(start).then(function(o){follow();return o})};
window.agentOS.ready.catch(function(e){if(!SB&&!document.querySelector('.boot-error'))bootError(e,false)});
})();
</script>
