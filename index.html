<title>Agent OS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap">
<style id="page-style">
/* Empty page; one floating icon button opens the JSON panel. */
:root{--bg:#f3f5f8;--panel:#ffffff;--sunk:#eef1f5;--fg:#17202c;--muted:#5f6b7b;--line:#dde2e9;--accent:#3152d4;--accent-soft:#e6ebfc;--on-accent:#ffffff;
  --t-str:#18794e;--t-num:#b4530b;--t-bool:#7b3fc4;--t-null:#8690a0;--t-file:#9a6a00;
  --ok:#18794e;--ok-soft:#e3f4ea;--warn:#a35a00;--warn-soft:#fbefdc;--off:#6b7584;--off-soft:#eceff3;--bad:#c0322b;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;--sans:system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141b;--panel:#161d27;--sunk:#121821;--fg:#e4e9f0;--muted:#94a0b1;--line:#263040;--accent:#8aa4ff;--accent-soft:#1f2a4a;--on-accent:#0f141b;
  --t-str:#6fd3a0;--t-num:#f0a35e;--t-bool:#c39bff;--t-null:#8691a3;--t-file:#e6c15c;--ok:#6fd3a0;--ok-soft:#173326;--warn:#f0b35e;--warn-soft:#3a2a12;--off:#97a2b3;--off-soft:#222b37;--bad:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f141b;--panel:#161d27;--sunk:#121821;--fg:#e4e9f0;--muted:#94a0b1;--line:#263040;--accent:#8aa4ff;--accent-soft:#1f2a4a;--on-accent:#0f141b;
  --t-str:#6fd3a0;--t-num:#f0a35e;--t-bool:#c39bff;--t-null:#8691a3;--t-file:#e6c15c;--ok:#6fd3a0;--ok-soft:#173326;--warn:#f0b35e;--warn-soft:#3a2a12;--off:#97a2b3;--off-soft:#222b37;--bad:#ff8a80;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans)}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,.val:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#toggle{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));z-index:3;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--accent);cursor:pointer;display:grid;place-items:center;font:600 14px var(--mono)}
#toggle[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
#panel{box-sizing:border-box;padding-block:64px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:980px;margin:0 auto}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.status{font-size:12px;color:var(--muted);margin-right:auto}
.status.dirty{color:var(--warn)}.status.bad{color:var(--bad)}
.btn{padding:7px 12px;border-radius:7px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:13px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn:disabled{opacity:.45;cursor:default}
.tree{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 6px;overflow-x:auto;font:13px/1 var(--mono)}
.row{display:flex;align-items:center;gap:6px;min-height:28px;padding:0 6px;border-radius:6px;white-space:nowrap}
.row:hover{background:var(--sunk)}
.caret{width:18px;height:18px;border:0;background:none;padding:0;cursor:pointer;color:var(--muted);display:grid;place-items:center;flex:none;border-radius:4px}
.caret:hover{background:var(--line);color:var(--fg)}
.caret svg{transition:transform .12s}
.row.open .caret svg{transform:rotate(90deg)}
.sp{width:18px;flex:none}
.ico{width:18px;height:18px;flex:none;display:grid;place-items:center;border-radius:4px;font:600 10px var(--mono)}
.ico.obj,.ico.arr{color:var(--accent);background:var(--accent-soft)}
.ico.str{color:var(--t-str)}.ico.num{color:var(--t-num)}.ico.bool{color:var(--t-bool)}.ico.null{color:var(--t-null)}.ico.folder,.ico.file{color:var(--t-file)}
.key{font-weight:500;padding:2px}
.colon{color:var(--muted);margin-left:-4px}
.val{padding:3px 6px;border-radius:4px;cursor:text;border:1px solid transparent}
.val:hover{border-color:var(--line)}
.val.str{color:var(--t-str)}.val.num{color:var(--t-num)}.val.null{color:var(--t-null);font-style:italic}
.val.str::before,.val.str::after{content:'"';opacity:.5}
.val.pill{font:600 11px var(--sans);text-transform:uppercase;letter-spacing:.06em;border-radius:99px;padding:3px 8px}
.pill.ok{color:var(--ok);background:var(--ok-soft)}.pill.mock{color:var(--warn);background:var(--warn-soft)}.pill.off{color:var(--off);background:var(--off-soft)}
.toggle{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:2px 8px 2px 3px;background:var(--panel);cursor:pointer;color:var(--t-bool);font:12px var(--mono)}
.toggle i{width:14px;height:14px;border-radius:50%;background:var(--off-soft);border:1px solid var(--line)}
.toggle.on i{background:var(--t-bool);border-color:var(--t-bool)}
.meta,.empty{color:var(--muted);font-size:11px}.empty{font-style:italic}
.kids{margin-left:15px;padding-left:9px;border-left:1px solid var(--line)}
.edit{font:13px var(--mono);color:var(--fg);background:var(--panel);border:1px solid var(--accent);border-radius:4px;padding:3px 6px}
@media (max-width:640px){.kids{margin-left:10px;padding-left:6px}}
@media (prefers-reduced-motion:reduce){.caret svg{transition:none}}
</style>
<button id="toggle" type="button" aria-label="Show or hide state.json" title="state.json">{}</button>
<div id="panel"></div>
<script type="application/json" id="page-data">{
  "agents": {
    "agent-oss": {
      "connection": {},
      "files": {
        ".claude": {
          "CLAUDE.md": {},
          "settings.json": {},
          "settings.local.json": {},
          "agents": {},
          "commands": {},
          "skills": {},
          "hooks": {},
          "output-styles": {}
        }
      }
    }
  },
  "extension": {
    "view": {
      "header-view": {
        "rundown_button": { "shown_on": "tablet and phone", "open": false },
        "brand": { "name": "Slide", "recording_lamp": false },
        "connections": {
          "apps":    { "label": "Profiles and apps", "state": "ok",   "detail": "3 profiles · 3 apps · now Profile 2, Instagram Slide app" },
          "agent":   { "label": "Agent",             "state": "mock", "detail": "agent-oss on This Claude project (cloud session) · Test flow uses the mock agent" },
          "mcp":     { "label": "MCP",               "state": "off",  "detail": "Agent → extension over MCP. Off in this test." },
          "storage": { "label": "Storage",           "state": "mock", "detail": "Shared state: not connected, so this browser only." }
        },

        "apps_button": { "pressed": false, "profile_badge": "2" },
        "back_button": {},
        "theme_button": { "theme": "system" },

      }

    "apps": {}
  }
}</script>
<script id="page-app">
(function(){
'use strict';
var FONTS='https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap';
var RESET=':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
var data=JSON.parse(document.getElementById('page-data').textContent);
var saved=JSON.stringify(data,null,2);
var ui={};try{ui=JSON.parse(localStorage.getItem('agent-os-ui')||'{}')}catch(e){}
var open=ui.open!==false,collapsed=new Set(ui.collapsed||[]),api=null,canSave=false,busy=false,editing=false;
var panel=document.getElementById('panel'),tgl=document.getElementById('toggle');

function persist(){try{localStorage.setItem('agent-os-ui',JSON.stringify({open:open,collapsed:Array.from(collapsed)}))}catch(e){}}
function isObj(v){return v!==null&&typeof v==='object'}
function typeOf(v){return Array.isArray(v)?'arr':v===null?'null':typeof v==='object'?'obj':typeof v==='string'?'str':typeof v==='number'?'num':'bool'}
function pk(p){return JSON.stringify(p)}
function getAt(p){var v=data;for(var i=0;i<p.length;i++)v=v[p[i]];return v}
function setAt(p,val){getAt(p.slice(0,-1))[p[p.length-1]]=val}
function walk(v,p,fn){fn(v,p);if(isObj(v))Object.keys(v).forEach(function(k){walk(v[k],p.concat(Array.isArray(v)?+k:k),fn)})}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function caret(){var s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('width','10');s.setAttribute('height','10');s.setAttribute('viewBox','0 0 10 10');var p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d','M3 1.5 7 5 3 8.5');p.setAttribute('fill','none');p.setAttribute('stroke','currentColor');p.setAttribute('stroke-width','1.6');p.setAttribute('stroke-linecap','round');s.appendChild(p);return s}
// Under a "files" key, names with an extension are files and the rest are folders.
function fileKind(parent,key){if(parent.indexOf('files')<0||typeof key!=='string')return null;return key.charAt(0)!=='.'&&/\.[a-z0-9]+$/i.test(key)?'file':'folder'}

function render(){
  tgl.setAttribute('aria-pressed',String(open));panel.hidden=!open;panel.textContent='';
  if(!open)return;
  var bar=el('div','bar');
  var st=el('span','status');st.id='status';bar.appendChild(st);
  var co=el('button','btn','Collapse all');co.type='button';co.onclick=function(){walk(data,[],function(v,p){if(isObj(v)&&p.length)collapsed.add(pk(p))});persist();render()};
  var sv=el('button','btn primary','Save');sv.type='button';sv.id='save';sv.onclick=save;
  bar.appendChild(co);bar.appendChild(sv);panel.appendChild(bar);
  var t=el('div','tree');t.setAttribute('role','tree');
  Object.keys(data).forEach(function(k){t.appendChild(node(k,data[k],[k],'obj'))});
  panel.appendChild(t);status();
}
function status(){
  var st=document.getElementById('status'),sv=document.getElementById('save');if(!st)return;
  var d=JSON.stringify(data,null,2)!==saved;
  sv.disabled=!canSave||!d||busy||editing;
  st.className='status'+(d?' dirty':'');
  st.textContent=busy?'Saving…':d?(canSave?'Unsaved changes':'Unsaved (view only)'):(canSave?'Saved':'View only');
}
function node(key,v,path,parentType){
  var id=pk(path),type=typeOf(v),n=isObj(v)?Object.keys(v).length:0,isOpen=n>0&&!collapsed.has(id);
  var wrap=el('div'),row=el('div','row'+(isOpen?' open':''));row.setAttribute('role','treeitem');
  if(n){var c=el('button','caret');c.type='button';c.setAttribute('aria-label',isOpen?'Collapse':'Expand');c.appendChild(caret());c.onclick=function(){if(isOpen)collapsed.add(id);else collapsed.delete(id);persist();render()};row.appendChild(c)}
  else row.appendChild(el('span','sp'));
  var fk=type==='obj'?fileKind(path.slice(0,-1),key):null;
  var ico=el('span','ico '+(fk||type),fk==='folder'?'▤':fk==='file'?'≡':{obj:'{}',arr:'[]',str:'Aa',num:'#',bool:'◐',null:'∅'}[type]);
  ico.title=fk||{obj:'object',arr:'list',str:'text',num:'number',bool:'true/false',null:'null'}[type];row.appendChild(ico);
  var k=el('span','key',String(key));
  if(parentType!=='arr'){k.title='Double-click to rename';k.ondblclick=function(){editKey(k,path)}}
  row.appendChild(k);
  if(!isObj(v)){row.appendChild(el('span','colon',':'));row.appendChild(valueEl(v,path,key))}
  else if(!n)row.appendChild(el('span','empty',fk==='file'?'empty file':fk==='folder'?'empty folder':'empty'));
  else row.appendChild(el('span','meta',n+(type==='arr'?(n===1?' item':' items'):(n===1?' key':' keys'))));
  wrap.appendChild(row);
  if(isOpen){var kids=el('div','kids');kids.setAttribute('role','group');Object.keys(v).forEach(function(c){var ck=Array.isArray(v)?+c:c;kids.appendChild(node(ck,v[c],path.concat(ck),type))});wrap.appendChild(kids)}
  return wrap;
}
function valueEl(v,path,key){
  var type=typeOf(v),e;
  if(type==='bool'){e=el('button','toggle'+(v?' on':''));e.type='button';e.appendChild(el('i'));e.appendChild(document.createTextNode(String(v)));e.setAttribute('aria-pressed',String(v));e.onclick=function(){setAt(path,!v);render()};return e}
  e=el('span',key==='state'&&/^(ok|mock|off)$/.test(v)?'val pill '+v:'val '+type,type==='null'?'null':String(v));
  e.tabIndex=0;e.title='Click to edit';
  e.onclick=function(){editVal(e,path,v)};e.onkeydown=function(ev){if(ev.key==='Enter'){ev.preventDefault();editVal(e,path,v)}};
  return e;
}
function input(text,commit){
  var i=el('input','edit'),done=false;i.value=text;i.size=Math.max(6,Math.min(60,text.length+2));editing=true;status();
  function fin(ok){if(done)return;done=true;editing=false;if(ok)commit(i.value);render()}
  i.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();fin(true)}else if(e.key==='Escape'){e.preventDefault();fin(false)}};
  i.oninput=function(){i.size=Math.max(6,Math.min(60,i.value.length+2))};
  i.onblur=function(){fin(true)};
  return i;
}
function editVal(e,path,v){
  var i=input(v===null?'null':String(v),function(txt){
    var nv;if(typeof v==='string')nv=txt;else{try{nv=JSON.parse(txt)}catch(_){nv=txt}if(isObj(nv))nv=txt}
    setAt(path,nv);
  });
  e.replaceWith(i);i.focus();i.select();
}
function editKey(k,path){
  var old=path[path.length-1];
  var i=input(String(old),function(txt){
    var name=txt.trim(),parent=getAt(path.slice(0,-1));
    if(!name||name===old||Object.prototype.hasOwnProperty.call(parent,name))return;
    var out={};Object.keys(parent).forEach(function(x){out[x===old?name:x]=parent[x]});
    if(path.length===1)data=out;else setAt(path.slice(0,-1),out);
  });
  k.replaceWith(i);i.focus();i.select();
}
function doc(text){
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+
    '<title>'+document.title+'</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<link rel="stylesheet" href="'+FONTS+'">\n'+
    '<style id="page-style">'+document.getElementById('page-style').textContent+'</style>\n'+
    '<button id="toggle" type="button" aria-label="Show or hide state.json" title="state.json">{}</button>\n<div id="panel"></div>\n'+
    '<script type="application/json" id="page-data">'+text.replace(/<\//g,'<\\/')+'<\/script>\n'+
    '<script id="page-app">'+document.getElementById('page-app').textContent+'<\/script></body></html>';
}
function save(){
  if(!api||busy||editing)return;var text=JSON.stringify(data,null,2);if(text===saved)return;
  busy=true;status();
  api.publish(doc(text)).then(function(){saved=text;busy=false;status()},function(e){
    busy=false;var c=e&&e.code;if(c==='not_granted'||c==='not_writer')canSave=false;status();
    if(c!=='not_granted'&&c!=='not_writer'){var st=document.getElementById('status');st.className='status bad';st.textContent=c==='conflict'?'Someone saved first; reloading their version.':'Could not save: '+((e&&e.message)||c||'unknown error')}
  });
}
tgl.onclick=function(){open=!open;persist();render()};
document.addEventListener('keydown',function(e){if((e.metaKey||e.ctrlKey)&&e.key==='s'){e.preventDefault();save()}});
render();
if(window.claude&&claude.use){claude.use('artifact').then(function(a){api=a;canSave=!!a;status()},function(){})}
})();
</script>
