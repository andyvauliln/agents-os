<title>Agent OS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Only what the runtime needs before the state is loaded. The page's own html and styles are in extension.views.index-view. */
html,body{height:100%;margin:0}
body{background:#f3f5f8;color:#17202c;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){body{background:#0f141b;color:#e4e9f0}}
.boot-error{margin:24px 16px;padding:16px;border:1px solid #c0322b;border-radius:10px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.boot-error pre{margin:0;white-space:pre-wrap;font:12px ui-monospace,Menlo,monospace;color:#c0322b}
</style>
<div id="index-view"></div>
<script src="state-core.js"></script>
<script>
(function(){
'use strict';
var core=window.StateCore;
// When the runtime started, in ms after the page opened (the timeline starts from the page opening).
var startedAt=performance.now();
// The runtime's own source: a preview page runs a copy of it.
var SRC=document.currentScript?document.currentScript.textContent:window.agentOSPreview?window.agentOSPreview.src:'';
var coreText=null;
function coreSource(){return coreText||(coreText=fetch('state-core.js').then(function(r){if(!r.ok)throw new Error('state-core.js: HTTP '+r.status);return r.text()}))}
// Set when this page is a preview of one view (see os.preview): {id, view, state}.
var SB=window.agentOSPreview||null;
var session='s'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
var live=null,db=null,store=null,mounted={},loaded={},watchers={};
var own={};
function addCommit(c){if(!history.commits.some(function(x){return x.n===c.n}))history.commits.push(c)}
var history={commits:[],canWrite:true,kind:'memory',put:function(c){own[c.n]=true;return store.put(c).then(function(){addCommit(c);return c},function(e){delete own[c.n];if(e&&e.code==='invalid_argument')history.canWrite=false;throw e})}};

/* ---------- storage: commits/c000001...; one calls/<session> log per page load ---------- */
function memoryStore(){var list=[];return{kind:'memory',list:function(){return Promise.resolve(list.slice())},put:function(c){list.push(c);return Promise.resolve()}}}
function dbStore(db){return{kind:'db',
  list:function(){return db.collection('commits').orderBy('n').get().then(function(s){return s.docs.map(function(d){return d.data()})})},
  put:function(c){return db.collection('commits').doc(core.commitId(c.n)).set(c)}}}
var callsTimer=null,callsWriting=false,callsAgain=false;
function queueCalls(){clearTimeout(callsTimer);callsTimer=setTimeout(writeCalls,1200)}
function writeCalls(){
  if(!db)return;if(callsWriting){callsAgain=true;return}
  callsWriting=true;
  var items=tracker.records.slice(-400).map(function(r){return JSON.parse(JSON.stringify(r))});
  db.doc('calls/'+session).set({session:session,started:items.length?items[0].at:null,count:tracker.records.length,items:items})
    .catch(function(){}).then(function(){callsWriting=false;if(callsAgain){callsAgain=false;writeCalls()}});
}
var tracker=core.createTracker({onRecord:queueCalls,brief:core.brief});

/* ---------- running functions from state ---------- */
// "extension.functions.render" is a path in the state; "local.x" is a function of the calling view.
function resolve(name,viewPath){
  if(name.indexOf('local.')===0){var v=core.getPath(live,viewPath);var f=v&&v.functions&&v.functions[name];return f?{def:f,path:viewPath+'.functions.'+name,view:viewPath}:null}
  var def=core.getPath(live,name);return def?{def:def,path:name,view:viewPath}:null;
}
// imports: {name: "index.html" | url | [urls] | source | path}. "index.html" is this runtime: os (the state and the page)
// and ctx (this call). URLs load once as scripts (or stylesheets); source is run as a module and gives what it exports;
// a path in the state points at source or URLs kept there once.
function loadImports(imports,c){
  var out={};
  return Object.keys(imports||{}).reduce(function(p,k){return p.then(function(){
    var v=imports[k];
    if(v==='index.html'){out[k]=k==='os'?OS:k==='ctx'?c:undefined;return}
    if(typeof v==='string'&&/^(extension|agents)\./.test(v)){var at=core.getPath(live,v);if(typeof at==='string'||Array.isArray(at))v=at}
    if(typeof v==='string'&&!/^https?:\/\//.test(v)){
      if(!loaded[v]){var m={exports:{}};new Function('module','exports','self',v)(m,m.exports,{});loaded[v]=Promise.resolve(m.exports)}
      return loaded[v].then(function(x){out[k]=x});
    }
    return [].concat(v).reduce(function(q,u){return q.then(function(){
      if(loaded[u])return loaded[u];
      return loaded[u]=new Promise(function(res,rej){
        var css=/\.css$/.test(u),el=document.createElement(css?'link':'script');
        if(css){el.rel='stylesheet';el.href=u}else el.src=u;
        el.onload=res;el.onerror=function(){rej(new Error('Could not load '+u))};document.head.appendChild(el);
      });
    })},Promise.resolve()).then(function(){out[k]=true});
  })},Promise.resolve()).then(function(){return out});
}
// import os from 'os'; import { a, b } from 'name'; import CodeMirror from 'codemirror' (a script gives its global).
function withImports(def,imports){
  var re=/^\s*import\s+(\w+|\{[^}]*\})\s+from\s+['"]([^'"]+)['"]\s*;?/,rest=def.code,names=[],values=[],m;
  while((m=re.exec(rest))){
    rest=rest.slice(m[0].length);
    var spec=m[2];
    if(!def.imports||!(spec in def.imports))throw new Error("import '"+spec+"' is not in imports");
    var mod=imports[spec];
    if(m[1].charAt(0)==='{')m[1].slice(1,-1).split(',').map(function(s){return s.trim()}).filter(Boolean).forEach(function(s){var a=s.split(/\s+as\s+/);names.push(a[1]||a[0]);values.push(mod&&mod[a[0]])});
    else{names.push(m[1]);values.push(mod===true?window[m[1]]:mod)}
  }
  if(!names.length)return null;
  return new Function(names.join(','),'"use strict";return ('+rest+');').apply(null,values);
}
// After every run: output (or the error), performance, errors, and a check against expected-state-change.
// output is what the function returned, as JSON (nothing returned: {}); page elements are named, not copied.
function plain(v){
  if(v===undefined||typeof v==='function')return {};
  if(typeof Node!=='undefined'&&v instanceof Node)return core.brief(v);
  try{return core.stripRuntime(JSON.parse(JSON.stringify(v)))}catch(e){return core.brief(v)}
}
// What nested calls changed counts for them, not for the caller: frames[callId] collects their changed paths.
var frames={};
function finish(path,def,input,before,t0,out,err,id,parent){
  var d=core.getPath(live,path)||def,ms=Math.round((performance.now()-t0)*10)/10,p=d.performance||{};
  d.performance={last:ms,min:p.min===undefined?ms:Math.min(p.min,ms),max:p.max===undefined?ms:Math.max(p.max,ms),count:(p.count||0)+1};
  var after=core.stripRuntime(live),fails=err?['threw: '+(err&&err.message||err)]:[],nested=frames[id]||[];delete frames[id];
  var changed=core.diff(before,after).map(function(x){return x.path.join('.')});
  if(frames[parent])frames[parent]=frames[parent].concat(changed);
  fails=fails.concat(core.checkStateChange(d['expected-state-change'],before,after,input,nested));
  d.output=err?{error:String(err&&err.message||err)}:plain(out);
  d.errors=fails;
  // What this function changed itself (not its nested calls), with the value before and after.
  var own=core.diff(before,after).filter(function(x){var p=x.path.join('.');return !nested.some(function(k){return p===k||p.indexOf(k+'.')===0})})
    .map(function(x){return {type:x.type,path:x.path.join('.'),before:core.brief(x.before),after:core.brief(x.after)}});
  return {changes:core.diff(before,after).map(function(x){return x.type+' '+x.path.join('.')}),stateChanges:own,errors:fails,performance:d.performance};
}
// via: what started a call that nothing else called: start, click, watch or test (code that calls os.call gives none).
function call(name,input,viewPath,parent,via){
  var r=resolve(name,viewPath),top=null;
  var run=tracker.track(name,{input:input===undefined?null:input,view:viewPath||null,via:via||null},function(ctx){
    top=ctx.id;
    if(!r)throw new Error('No function '+name+(viewPath?' in '+viewPath:''));
    var def=r.def,before=core.stripRuntime(live),t0=performance.now();
    ctx.relate({fn:r.path,parent:parent||null});frames[ctx.id]=[];
    var c={id:ctx.id,input:input,view:r.view,root:r.view?document.getElementById(r.view.split('.').pop()):null,
      call:function(n,i){return call(n,i,r.view,ctx.id)}};
    return loadImports(def.imports,c).then(function(imports){
      if(def.code&&def.code.trim()){
        // code is a module as it looks in code: import lines, then async function name({ params }) { ... },
        // called with the input. Each import names a key of imports.
        var m=withImports(def,imports);
        if(m)return m(input&&typeof input==='object'?input:{});
        // Older versions: no import lines, and ctx, os and imports are given to the code; older still, a bare body.
        if(/^\s*(async\s+)?function\b/.test(def.code)){
          var g=new Function('ctx','os','imports','"use strict";return ('+def.code+');')(c,OS,imports);
          return g(input&&typeof input==='object'?input:{});
        }
        var f=new Function('ctx','input','os','imports','"use strict";return (async function(){\n'+def.code+'\n})();');
        return f(c,input,OS,imports);
      }
      // No code: run the declared calls in order.
      var names=Object.keys(def.calls||{});
      return names.reduce(function(p,n){return p.then(function(){return call(n,def.calls[n].input,r.view,ctx.id)})},Promise.resolve())
        .then(function(){return {calls:names}});
    }).then(function(out){
      var d=core.getPath(live,r.path)||def;
      // Each declared call gets the output of its last run.
      if(d.calls)Object.keys(d.calls).forEach(function(n){var x=resolve(n,r.view);if(x&&x.def.output!==undefined)d.calls[n].output=core.clone(x.def.output)});
      ctx.relate(finish(r.path,def,input,before,t0,out,null,ctx.id,parent));
      return out;
    },function(e){if(r)ctx.relate(finish(r.path,def,input,before,t0,null,e,ctx.id,parent));throw e});
  });
  return parent?run:run.then(function(o){return afterTop(name,top).then(function(){return o})},function(e){return afterTop(name,top).then(function(){throw e})});
}
// A view can watch the state: after each top-level call, the function it named with os.watch runs.
// The watch calls count as calls inside the call that ran (parent), so the timeline shows them under it.
function afterTop(name,parent){
  return Object.keys(watchers).reduce(function(p,v){return p.then(function(){
    if(!mounted[v]||watchers[v]===name)return;
    return call(watchers[v],{after:name},v,parent||'watch','watch').catch(report);
  })},Promise.resolve()).then(function(){if(SB)tell(name)});
}
// A preview tells the page that opened it what each action changed, and the view's ui-data after it.
var seen=null;
function tell(name,error){
  var now=core.stripRuntime(live),view=core.getPath(live,SB.view)||{};
  var changes=seen?core.diff(seen,now).map(function(x){return x.type+' '+x.path.join('.')}):[];
  seen=now;
  try{parent.postMessage({agentOSPreview:SB.id,call:name,error:error||'',changes:changes,uiData:core.clone(view['ui-data']||{})},'*')}catch(e){}
}

/* ---------- the os object every function gets ---------- */
var OS={
  get:function(path){return path?core.getPath(live,path):live},
  set:function(path,value){core.setPath(live,path,value)},
  replace:function(state){live=state},
  clone:core.clone,
  call:function(name,input,viewPath,parent){return call(name,input,viewPath,parent)},
  template:core.template,
  mounted:function(path){return !!mounted[path]},
  setMounted:function(path,on){mounted[path]=on;if(!on){delete watchers[path];delete OS.refs[path.split('.').pop()]}},
  watch:function(viewPath,fnName){watchers[viewPath]=fnName},
  bind:function(root,viewPath){
    Array.prototype.forEach.call(root.querySelectorAll('[data-call]'),function(b){
      b.addEventListener('click',function(){var i=b.getAttribute('data-input');call(b.getAttribute('data-call'),i===null?{}:JSON.parse(i),viewPath,null,'click').catch(report)});
    });
  },
  runTests:function(){return runTests()},
  // Every call of this page load, in the order they ended: {id, name, at, input: {input, view, via}, ok, output, error, ms,
  // related: {fn, parent, stateChanges, errors, ...}}. started: when the runtime started, in ms after the page opened.
  calls:tracker.records,
  started:startedAt,
  // Runs one view with a copy of the state in a frame: its buttons work, and nothing is saved.
  // The frame posts {agentOSPreview: id, call, changes, uiData, error} to this page after each action.
  // The runtime and state-core run in the frame's own window. (preview(state, view, id) gives the page as html.)
  preview:function(frame,state,viewPath,id){
    if(!frame||!frame.contentWindow&&!frame.tagName){
      var cfg=JSON.stringify({id:viewPath,view:state,state:frame,src:SRC}).replace(/</g,'\\u003c');
      return '<!doctype html><meta charset="utf-8"><style>html,body{margin:0}</style><div id="index-view"></div>'+
        '<script src="state-core.js"><\/script><script>window.agentOSPreview='+cfg+'<\/script><script>'+SRC+'<\/script>';
    }
    frame.setAttribute('data-preview',id);
    frame.onload=function(){
      var w=frame.contentWindow;
      if(!w||frame.getAttribute('data-preview')!==id)return;
      coreSource().then(function(src){
        if(frame.getAttribute('data-preview')!==id)return;
        w.agentOSPreview={id:id,view:viewPath,state:state,src:SRC};
        w.eval(src);
        w.eval(SRC);
      }).catch(report);
    };
    frame.srcdoc='<!doctype html><meta charset="utf-8"><style>html,body{margin:0}</style><div id="index-view"></div>';
  },
  history:history,
  // What a view keeps while it is on screen that cannot live in the state (an editor instance, unsaved text).
  refs:{}
};

/* ---------- tests written in the state ---------- */
function runTests(){
  var list=[];
  core.walk(live,[],function(v,p){
    if(p[p.length-2]!=='functions'||!v||!v.tests||p.indexOf('calls')>=0||p.indexOf('output')>=0)return;
    var name=p[p.length-1],viewPath=name.indexOf('local.')===0?p.slice(0,-2).join('.'):null,fnName=viewPath?name:p.join('.');
    Object.keys(v.tests).forEach(function(t){list.push({fn:fnName,view:viewPath,test:t,path:p.join('.')})});
  });
  var results=[];
  return list.reduce(function(prev,item){return prev.then(function(){
    var spec=core.getPath(live,item.path).tests[item.test];
    return tracker.track('runTest',{fn:item.fn,test:item.test},function(ctx){
      var t0=performance.now(),before=spec.before||{},start=null;
      // "before" lists calls that put the page in the state the test needs.
      return Object.keys(before).reduce(function(p,n){return p.then(function(){return call(n,before[n],item.view,ctx.id)}).then(function(){return afterTop(n,ctx.id)})},Promise.resolve()).then(function(){
        start=core.stripRuntime(live);
        return call(item.fn,spec.input,item.view,ctx.id);
      }).then(function(out){
        return afterTop(item.fn,ctx.id).then(function(){
          // The state after the run: expected-state-change errors, then the test's own expect (output, dom, state).
          var errs=core.getPath(live,item.path).errors||[];
          var st={get:function(p){return core.getPath(live,p)},changed:core.diff(start,core.stripRuntime(live)).map(function(x){return x.path.join('.')})};
          return errs.concat(core.checkExpect(spec.expect||{},out,function(sel){return !!document.querySelector(sel)},st));
        });
      },function(e){return ['threw: '+(e&&e.message||e)]}).then(function(fails){
        var res={ok:!fails.length,fails:fails,ms:Math.round((performance.now()-t0)*10)/10,at:new Date().toISOString()};
        var s=core.getPath(live,item.path);if(s&&s.tests&&s.tests[item.test])s.tests[item.test].result=res;
        ctx.relate({fn:item.fn,test:item.test,ok:res.ok});
        results.push({fn:item.fn,test:item.test,ok:res.ok,fails:fails});
        return res;
      });
    });
  })},Promise.resolve()).then(function(){return afterTop('runTests')}).then(function(){return results});
}

/* ---------- boot ---------- */
function report(e){console.error(e);if(SB)tell(null,String(e&&e.message||e))}
function bootError(e,canRetry){
  var app=document.getElementById('index-view');app.textContent='';
  var box=document.createElement('div');box.className='boot-error';
  var h=document.createElement('strong');h.textContent='This version of the state did not start';box.appendChild(h);
  var pre=document.createElement('pre');pre.textContent=String(e&&e.stack||e&&e.message||e);box.appendChild(pre);
  var c=history.commits;
  if(canRetry){var b=document.createElement('button');b.textContent='Run version '+c[c.length-2].n+' instead';
    b.onclick=function(){live=core.parseJsonc(c[c.length-2].state);start()};box.appendChild(b)}
  app.appendChild(box);
}
function start(){
  mounted={};watchers={};
  if(SB)return startPreview();
  // Older versions take the view path itself as input; newer ones take { view_path }.
  var r=core.getPath(live,'extension.functions.render'),sig=r&&/^\s*(import\b|(async\s+)?function\b)/.test(r.code||'');
  return call('extension.functions.render',sig?{view_path:'extension.views.index-view'}:'extension.views.index-view',null,null,'start').catch(function(e){bootError(e,history.commits.length>1);throw e});
}
// A preview: index-view's html is put on the page without running it, then the one view renders.
function startPreview(){
  seen=core.stripRuntime(live);
  if(SB.view!=='extension.views.index-view'){
    var iv=core.getPath(live,'extension.views.index-view')||{},t=document.createElement('template'),host=document.getElementById('index-view');
    t.innerHTML=core.template(iv.html||'',iv['ui-data']||{});
    var el=t.content.firstElementChild;
    if(el&&el.id==='index-view')host.replaceWith(el);else host.innerHTML=t.innerHTML;
  }
  return call('extension.functions.render',{view_path:SB.view},null).catch(function(e){report(e);throw e});
}
var ready=SB?Promise.resolve().then(function(){
  live=core.clone(SB.state);history.canWrite=false;history.kind='preview';
  try{history.commits=parent.agentOS.history.commits.slice()}catch(e){history.commits=[]}
  store={kind:'preview',list:function(){return Promise.resolve(history.commits)},put:function(){return Promise.reject(new Error('A preview does not save'))}};
  return {preview:SB.view};
}):tracker.track('loadState',{session:session},function(ctx){
  return fetch('state.json').then(function(r){if(!r.ok)throw new Error('state.json: HTTP '+r.status);return r.text()}).then(function(seed){
    var getDb=window.claude&&claude.use?claude.use('db'):Promise.resolve(null);
    return getDb.then(function(d){db=d;store=d?dbStore(d):memoryStore();history.kind=store.kind;return store.list()}).then(function(list){
      history.commits=list;
      if(list.length)return;
      var c1=core.makeCommit(null,seed.replace(/\s+$/,''),new Date().toISOString());
      return store.put(c1).then(function(){history.commits.push(c1);ctx.relate({created:1})},function(e){history.canWrite=false;history.commits.push(c1);ctx.relate({created:0,writeError:e&&e.code||String(e)})});
    }).then(function(){
      var head=history.commits[history.commits.length-1];
      live=core.parseJsonc(head.state);
      ctx.relate({store:history.kind,commits:history.commits.length,head:head.n});
      return {commits:history.commits.length,head:head.n};
    });
  });
});
// A newer version saved somewhere else (another tab, or a release) runs here as soon as it is saved,
// unless this page has unsaved edits. A page that stays open never shows an old version.
function follow(){
  if(!db)return;
  var q=db.collection('commits').orderBy('n');
  if(!q.onSnapshot)return;
  q.onSnapshot(function(s){
    var known=history.commits.length?history.commits[history.commits.length-1].n:0;
    var fresh=s.docs.map(function(d){return d.data()}).filter(function(c){return c&&c.n>known&&!own[c.n]});
    if(!fresh.length)return;
    fresh.sort(function(a,b){return a.n-b.n}).forEach(addCommit);
    var sv=OS.refs['state-view'];
    if(sv&&sv.draft!==null)return;
    tracker.track('loadNewerVersion',{head:history.commits[history.commits.length-1].n},function(){
      live=core.parseJsonc(history.commits[history.commits.length-1].state);
      return start();
    }).catch(report);
  },function(e){report(e)});
}
window.agentOS={os:OS,calls:tracker.records,history:history,get state(){return live},ready:ready.then(start).then(function(o){follow();return o})};
window.agentOS.ready.catch(function(e){if(!SB&&!document.querySelector('.boot-error'))bootError(e,false)});
})();
</script>
