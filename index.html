/* Empty page; one floating icon button shows the JSON editor. */
:root{--bg:#f3f5f8;--panel:#ffffff;--gutter:#f7f8fa;--fg:#17202c;--muted:#6a7584;--line:#dde2e9;--accent:#3152d4;--on-accent:#ffffff;--sel:#dbe3fb;--active:#f2f5fc;
  --key:#17202c;--key-empty:#8b95a5;--str:#18794e;--num:#b4530b;--atom:#7b3fc4;--punct:#8b95a5;--warn:#a35a00;--bad:#c0322b;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;--sans:system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141b;--panel:#161d27;--gutter:#131922;--fg:#e4e9f0;--muted:#8c98aa;--line:#263040;--accent:#8aa4ff;--on-accent:#0f141b;--sel:#27355c;--active:#1b2330;
  --key:#e4e9f0;--key-empty:#77839a;--str:#6fd3a0;--num:#f0a35e;--atom:#c39bff;--punct:#77839a;--warn:#f0b35e;--bad:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f141b;--panel:#161d27;--gutter:#131922;--fg:#e4e9f0;--muted:#8c98aa;--line:#263040;--accent:#8aa4ff;--on-accent:#0f141b;--sel:#27355c;--active:#1b2330;
  --key:#e4e9f0;--key-empty:#77839a;--str:#6fd3a0;--num:#f0a35e;--atom:#c39bff;--punct:#77839a;--warn:#f0b35e;--bad:#ff8a80;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans)}
button{font:inherit}
button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#toggle{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));z-index:3;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--accent);cursor:pointer;display:grid;place-items:center;font:600 14px var(--mono)}
#toggle[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
#panel{height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{display:flex;align-items:center;gap:8px;min-height:40px;padding-right:52px}
.status{font-size:12px;color:var(--muted);margin-right:auto;min-width:0}
.status.dirty{color:var(--warn)}.status.bad{color:var(--bad)}
.btn{padding:7px 12px;border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn:disabled{opacity:.45;cursor:default}
#editor{flex:1;min-height:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.CodeMirror{height:100%;font:13px/1.6 var(--mono);background:var(--panel);color:var(--fg)}
.CodeMirror-gutters{background:var(--gutter);border-right:1px solid var(--line)}
.CodeMirror-linenumber{color:var(--muted)}
.CodeMirror-cursor{border-left-color:var(--fg)}
.CodeMirror-selected,.CodeMirror-focused .CodeMirror-selected{background:var(--sel)}
.CodeMirror-line::selection,.CodeMirror-line>span::selection,.CodeMirror-line>span>span::selection{background:var(--sel)}
.CodeMirror-scrollbar-filler,.CodeMirror-gutter-filler{background:var(--panel)}
.CodeMirror-foldgutter{width:14px}
.CodeMirror-foldgutter-open,.CodeMirror-foldgutter-folded{cursor:pointer;color:var(--muted);text-align:center}
.CodeMirror-foldgutter-open:after{content:"\25BE"}
.CodeMirror-foldgutter-folded:after{content:"\25B8";color:var(--accent)}
.CodeMirror-foldmarker{color:var(--accent);background:var(--sel);border-radius:4px;padding:0 5px;margin:0 2px;cursor:pointer;font-family:var(--mono)}
div.CodeMirror span.CodeMirror-matchingbracket{color:var(--accent);font-weight:600}
div.CodeMirror span.CodeMirror-nonmatchingbracket{color:var(--bad)}
.cm-s-agent .cm-string.cm-key{color:var(--key);font-weight:500}
.cm-s-agent .cm-string.cm-key.cm-emptykey{color:var(--key-empty);font-weight:400}
.cm-s-agent .cm-string{color:var(--str)}
.cm-s-agent .cm-number{color:var(--num)}
.cm-s-agent .cm-atom{color:var(--atom)}
.cm-s-agent .cm-emptyobj{color:var(--key-empty)}
.cm-s-agent .cm-error{color:var(--bad);text-decoration:underline wavy}
.bad-line{background:color-mix(in srgb,var(--bad) 14%,transparent)}

<script id="page-app">
(function(){
'use strict';
var FONTS='https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap';
var RESET=':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
var saved=document.getElementById('page-data').textContent.replace(/<\\\//g,'</');
var panel=document.getElementById('panel'),tgl=document.getElementById('toggle'),st=document.getElementById('status'),sv=document.getElementById('save');
var open=true;try{open=localStorage.getItem('agent-os-open')!=='0'}catch(e){}
var api=null,canSave=false,busy=false,err=null,badLine=null;

// Keys get their own colour; keys whose value is an empty object a softer one.
var emptyKeys={token:function(s){
  if(s.match(/^"(?:[^"\\]|\\.)*"(?=\s*:\s*\{\s*\})/))return 'key emptykey';
  if(s.match(/^"(?:[^"\\]|\\.)*"(?=\s*:)/))return 'key';
  if(s.match(/^\{\s*\}/))return 'emptyobj';
  while(s.next()!=null&&!s.match(/^(?=["{])/,false)){}
  return null;
}};
var cm=CodeMirror(document.getElementById('editor'),{
  value:saved,mode:{name:'javascript',json:true},theme:'agent',lineNumbers:true,indentUnit:2,tabSize:2,
  foldGutter:true,gutters:['CodeMirror-linenumbers','CodeMirror-foldgutter'],matchBrackets:true,autoCloseBrackets:true,
  foldOptions:{widget:'…'},extraKeys:{'Cmd-S':save,'Ctrl-S':save,'Ctrl-Q':function(c){c.foldCode(c.getCursor())}}
});
cm.addOverlay(emptyKeys);
cm.setOption('foldGutter',false);cm.setOption('foldGutter',true);
cm.on('change',check);

function check(){
  var text=cm.getValue();err=null;
  if(badLine!==null){cm.removeLineClass(badLine,'background','bad-line');badLine=null}
  try{JSON.parse(text)}catch(e){
    err=e.message;var m=/line (\d+)/.exec(e.message)||null,pos=/position (\d+)/.exec(e.message);
    var ln=m?+m[1]-1:pos?cm.posFromIndex(+pos[1]).line:null;
    if(ln!==null){badLine=ln;cm.addLineClass(ln,'background','bad-line')}
  }
  var dirty=text!==saved;
  sv.disabled=!canSave||!dirty||!!err||busy;
  st.className='status'+(err?' bad':dirty?' dirty':'');
  st.textContent=err?'Invalid JSON: '+err:busy?'Saving…':dirty?(canSave?'Unsaved changes':'Unsaved (view only)'):(canSave?'Saved':'View only');
}
function collapseAll(){
  cm.operation(function(){
    for(var l=cm.lastLine();l>0;l--)cm.foldCode(CodeMirror.Pos(l,0),{rangeFinder:CodeMirror.fold.brace,widget:'…'},'fold');
  });
}
function show(){panel.hidden=!open;tgl.setAttribute('aria-pressed',String(open));if(open)cm.refresh();try{localStorage.setItem('agent-os-open',open?'1':'0')}catch(e){}}
function doc(text){
  var cdn=Array.prototype.map.call(document.querySelectorAll('script[data-cdn]'),function(s){return '<script data-cdn src="'+s.getAttribute('src')+'"><\/script>'}).join('\n');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+
    '<title>'+document.title+'</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<link rel="stylesheet" href="'+FONTS+'">\n'+
    '<style id="page-style">'+document.getElementById('page-style').textContent+'</style>\n'+
    '<button id="toggle" type="button" aria-label="Show or hide state.json" title="state.json">{}</button>\n'+
    '<div id="panel">\n  <div class="bar"><span id="status" class="status" role="status"></span><button id="collapse" class="btn" type="button">Collapse all</button><button id="save" class="btn primary" type="button">Save</button></div>\n  <div id="editor"></div>\n</div>\n'+
    cdn+'\n<script type="application/json" id="page-data">'+text.replace(/<\//g,'<\\/')+'<\/script>\n'+
    '<script id="page-app">'+document.getElementById('page-app').textContent+'<\/script></body></html>';
}
function save(){
  var text=cm.getValue();
  if(!api||busy||err||text===saved)return;
  busy=true;check();
  api.publish(doc(text)).then(function(){saved=text;busy=false;check()},function(e){
    busy=false;var c=e&&e.code;if(c==='not_granted'||c==='not_writer')canSave=false;check();
    if(c!=='not_granted'&&c!=='not_writer'){st.className='status bad';st.textContent=c==='conflict'?'Someone saved first; reloading their version.':'Could not save: '+((e&&e.message)||c||'unknown error')}
  });
}
tgl.onclick=function(){open=!open;show()};
document.getElementById('collapse').onclick=collapseAll;
sv.onclick=save;
show();check();
if(window.claude&&claude.use){claude.use('artifact').then(function(a){api=a;canSave=!!a;check()},function(){})}
})();
</script>
